  <g id="text_28">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20344b" x="41.472" y="25.92" transform="rotate(-0 41.472 25.92)">Four-region WAN: where latency accumulates</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.472" y="49.68" transform="rotate(-0 41.472 49.68)">30 s input · 100 tx/s · 1 useful byte/tx · Δ = 1,000 ms · 20 Mbps provider egress · natural WAN</text>
  </g>
  <g id="text_30">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.472" y="375.84" transform="rotate(-0 41.472 375.84)">Each bar uses one completed, fully instrumented cohort. Output is verified and contiguous, before diagnostic journaling.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.472" y="393.12" transform="rotate(-0 41.472 393.12)">Fault: Delugi silences replica 0 in Singapore; Raptr pauses replica 1 in Frankfurt. The fault mechanisms and placement differ.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536476" x="41.472" y="410.4" transform="rotate(-0 41.472 410.4)">Independent WAN runs on different dates; observer overhead is unquantified. Stage boundaries describe each implementation’s local observations.</text>
  </g>
