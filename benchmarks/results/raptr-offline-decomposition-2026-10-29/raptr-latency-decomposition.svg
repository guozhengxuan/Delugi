  <g id="text_29">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526274" x="64.8" y="58.212" transform="rotate(-0 64.8 58.212)">Four regions · 30 s input · 100 tx/s · 1 useful byte/tx · Δ = 1,000 ms · natural WAN</text>
  </g>
  <g id="text_30">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="64.8" y="82.0512" transform="rotate(-0 64.8 82.0512)">Arithmetic means over completed requests; the same requests contribute to every stage.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="64.8" y="439.6392" transform="rotate(-0 64.8 439.6392)">Coverage: healthy 3,000 / 3,000; silent leader 2,984 / 3,000 (99.47%).</text>
  </g>
  <g id="text_32">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526274" x="64.8" y="457.9344" transform="rotate(-0 64.8 457.9344)">The 16 silent-leader exclusions were cancelled before admission. They are not assigned zero latency.</text>
  </g>
  <g id="text_33">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #192d40" x="64.8" y="487.872" transform="rotate(-0 64.8 487.872)">Hatched interval combines batching, dissemination, consensus, payload fetch, FIFO release and logging.</text>
  </g>
  <g id="text_34">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #192d40" x="64.8" y="506.1672" transform="rotate(-0 64.8 506.1672)">Its internal boundaries were not recorded; a paper-style consensus-stage split cannot be recovered.</text>
  </g>
  <g id="text_35">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6d7d8c" x="64.8" y="533.8872" transform="rotate(-0 64.8 533.8872)">Source: saved 2026-10-28 journals · local monotonic timestamps · offline reconstruction only</text>
  </g>
