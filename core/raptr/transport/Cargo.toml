[package]
name = "raptr-shared-transport"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[dependencies]
shared-network = { path = "../../../shared/network" }
shared-network-async = { path = "../../../shared/network-async" }
shared-crypto = { path = "../../../shared/crypto" }
shared-metrics = { path = "../../../shared/metrics" }
serde = { version = "=1.0.197", features = ["derive"] }
bincode = "=1.3.3"

[dev-dependencies]
tokio = { version = "=1.40.0", features = ["sync", "macros", "rt", "time"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
