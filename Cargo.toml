[package]
name = "delugi"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
delugi-core = { path = "core/delugi" }
common-node = { path = "node" }
bincode = "=1.3.3"
ed25519-dalek = "=1.0.1"
libc = "=0.2.178"
serde = { version = "=1.0.190", features = ["derive"] }
serde_json = "=1.0.108"
sha2 = "=0.9.9"

[[bin]]
name = "ordering-trace"
path = "src/bin/ordering_trace.rs"

[[bin]]
name = "end-to-end-trace"
path = "src/bin/end_to_end_trace.rs"

[[bin]]
name = "delugi-replica"
path = "src/bin/delugi_replica.rs"

[workspace]
members = ["node", "core-api", "core/delugi", "shared/crypto", "shared/metrics", "shared/mempool", "shared/store", "shared/network", "shared/output", "shared/runtime"]
exclude = ["core/raptr"]
resolver = "2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[[bin]]
name = "delugi-node"
path = "node/src/main.rs"
