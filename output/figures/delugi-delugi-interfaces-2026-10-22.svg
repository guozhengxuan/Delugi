<text x="48" y="748" font-family="Arial,sans-serif" font-size="9.5" font-weight="normal" fill="#536678">Key separation: DirectCommit != ordered descriptor delivery != payload-verified application output.</text>
<text x="48" y="761" font-family="Arial,sans-serif" font-size="9.5" font-weight="normal" fill="#536678">Q checks immutable availability evidence; ordering does not wait for application materialization. TCP ACKs retire bounded in-flight frames, not each next send.</text>
