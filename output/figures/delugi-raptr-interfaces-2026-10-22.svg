<text x="654" y="176" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#346BAE">Native DisseminationLayer</text>
<text x="654" y="207" font-family="Courier New,monospace" font-size="9.8" font-weight="normal" fill="#536678">native/src/raptr/dissemination/mod.rs:81; node/dissemination.rs:204</text>
<polyline points="641,217 1151,217" fill="none" stroke="#B5C1CF" stroke-width="0.8"/>
<text x="654" y="232.0" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#BD424B">prepare_block(round, excludes, authors)</text>
<text x="654" y="252.18" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#BD424B">-&gt; Future&lt;Payload&gt;</text>
<text x="654" y="272.36" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#346BAE">available_prefix(payload, cached)</text>
<text x="654" y="292.54" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#346BAE">-&gt; Future&lt;(Prefix, BitVec)&gt;</text>
<text x="654" y="312.72" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#346BAE">check_payload(payload) -&gt; Result&lt;(), BitVec&gt;</text>
<text x="654" y="332.90000000000003" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#BA7023">notify_commit_identified(payloads, ts, voters)</text>
<text x="654" y="353.08000000000004" font-family="Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#1C2F44">CommittedPayload binds block_digest, payload and include_proofs.</text>
