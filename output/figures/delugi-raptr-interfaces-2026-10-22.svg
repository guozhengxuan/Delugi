<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
<rect width="1200" height="840" fill="white"/>
<text x="48" y="42" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#346BAE">DELUGI / IMPLEMENTATION MAP</text>
<text x="48" y="82" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#1C2F44">Raptr: native handlers plus a dissemination contract</text>
<text x="48" y="107" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#536678">The native Protocol and DisseminationLayer APIs stay in core/raptr; Context connects them to injected service adapters. Handler calls are async.</text>
<polyline points="48,785 1152,785" fill="none" stroke="#B5C1CF" stroke-width="0.8"/>
<text x="48" y="809" font-family="Arial,sans-serif" font-size="10" font-weight="normal" fill="#536678">SOURCE SNAPSHOT 57e078e  |  22 OCT 2026  |  Current implementation; no runtime changes</text>
<text x="1100" y="809" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#536678">3 / 5</text>
<rect x="48" y="150" width="521" height="286" rx="0" fill="#FFFFFF" stroke="#B5C1CF"/>
<rect x="48" y="150" width="521" height="39" rx="0" fill="#F4F7FA" stroke="#B5C1CF"/>
<text x="62" y="176" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#346BAE">native::framework::Protocol</text>
<text x="62" y="207" font-family="Courier New,monospace" font-size="9.8" font-weight="normal" fill="#536678">core/raptr/native/src/framework/mod.rs:36-134</text>
<polyline points="49,217 568,217" fill="none" stroke="#B5C1CF" stroke-width="0.8"/>
<text x="62" y="232.0" font-family="Courier New,monospace" font-size="11.5" font-weight="normal" fill="#536678">associated Message; TimerEvent</text>
<text x="62" y="252.18" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#BD424B">start_handler(ctx)</text>
<text x="62" y="272.36" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#346BAE">message_handler(ctx, from, message)</text>
<text x="62" y="292.54" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#346BAE">module_event_handler(ctx, module, event)</text>
<text x="62" y="312.72" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#8054A3">timer_event_handler(ctx, event)</text>
<text x="62" y="332.90000000000003" font-family="Courier New,monospace" font-size="11.5" font-weight="bold" fill="#8054A3">condition_handler(ctx)</text>
<text x="62" y="353.08000000000004" font-family="Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#1C2F44">run_ctx holds native state ownership for handler plus condition evaluation.</text>
